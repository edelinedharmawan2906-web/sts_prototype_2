# STS learning on a trusted private LAN.
# Python stays on loopback. Phone/browser reaches WebSocket on port 9001.
# Stop any previous broker before running this config.
listener 1883 127.0.0.1
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
